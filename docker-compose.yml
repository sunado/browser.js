version: "3.9"

# Runtime topology:
#   frontend -> nginx serving the built browser.js frontend
#   wisp     -> WISP WebSocket relay used by the frontend
#
# There is no separate application backend in this project. Put your own
# reverse proxy (Cloudflare, nginx, HAProxy, Caddy, ...) in front of the
# published ports below.
#
# Domain/URL values are derived by scripts/compose.sh from MAIN_DOMAIN. Use
# that wrapper so a single domain in .env is enough:
#   ./scripts/compose.sh up -d --build

services:
  frontend:
    build:
      context: .
      target: frontend
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
        WASM_BINDGEN_VERSION: ${WASM_BINDGEN_VERSION:-0.2.105}
        BINARYEN_VERSION: ${BINARYEN_VERSION:-123}
        # Embedded into the frontend at build time.
        VITE_WISP_URL: ${WISP_URL:?set WISP_URL or run scripts/compose.sh}
        VITE_ISOLATION_ORIGIN: ${ISOLATION_ORIGIN:-none}
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-localhost}
      FRONTEND_INTERNAL_PORT: ${FRONTEND_INTERNAL_PORT:-80}
    ports:
      # Bind to 127.0.0.1 when the reverse proxy runs on this host.
      # Use 0.0.0.0 when the proxy runs on another host/container.
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:${FRONTEND_INTERNAL_PORT:-80}"
    depends_on:
      - wisp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:$${FRONTEND_INTERNAL_PORT}/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  wisp:
    build:
      context: ./docker/wisp
      args:
        WISP_JS_VERSION: ${WISP_JS_VERSION:-0.4.1}
    environment:
      WISP_DOMAIN: ${WISP_DOMAIN:-localhost}
      WISP_INTERNAL_PORT: ${WISP_INTERNAL_PORT:-5001}
      WISP_LOG_LEVEL: ${WISP_LOG_LEVEL:-INFO}
      WISP_ALLOW_PRIVATE_IPS: ${WISP_ALLOW_PRIVATE_IPS:-false}
      WISP_ALLOW_LOOPBACK_IPS: ${WISP_ALLOW_LOOPBACK_IPS:-false}
      WISP_ALLOW_UDP_STREAMS: ${WISP_ALLOW_UDP_STREAMS:-true}
      WISP_ALLOW_TCP_STREAMS: ${WISP_ALLOW_TCP_STREAMS:-true}
      WISP_STREAM_LIMIT_TOTAL: ${WISP_STREAM_LIMIT_TOTAL:--1}
      WISP_STREAM_LIMIT_PER_HOST: ${WISP_STREAM_LIMIT_PER_HOST:--1}
    ports:
      - "${WISP_BIND:-127.0.0.1}:${WISP_PORT:-8081}:${WISP_INTERNAL_PORT:-5001}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:$${WISP_INTERNAL_PORT}/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
